<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3b82f6" />
  
  <!-- Clock face -->
  <circle cx="28" cy="28" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  
  <!-- Clock hour marks -->
  <line x1="28" y1="14" x2="28" y2="16.5" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="39.5" x2="28" y2="42" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="28" x2="16.5" y2="28" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39.5" y1="28" x2="42" y2="28" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Clock hands -->
  <line x1="28" y1="28" x2="28" y2="18" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="28" x2="35" y2="28" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Clock center dot -->
  <circle cx="28" cy="28" r="1.5" fill="#1e3a5f"/>
  
  <!-- Priority list badge (bottom-right) -->
  <rect x="38" y="36" width="20" height="22" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  
  <!-- Priority lines with numbers -->
  <text x="41" y="44.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#3b82f6">1</text>
  <line x1="46" y1="43" x2="55" y2="43" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  
  <text x="41" y="50.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#3b82f6">2</text>
  <line x1="46" y1="49" x2="55" y2="49" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  
  <text x="41" y="56.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#3b82f6">3</text>
  <line x1="46" y1="55" x2="55" y2="55" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>